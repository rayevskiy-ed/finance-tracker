<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:radial-gradient(900px 420px at 100% -10%,#16a34a26,transparent),radial-gradient(700px 400px at -10% 35%,#2563eb1c,transparent),var(--bg);background-attachment:fixed;color:var(--tx);padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}

</style></head><body><div id=app></div><script>
const $=s=>document.querySelector(s),app=$("#app"),LS=localStorage;let tok=LS.tok||"",reg=false,q="",tab="home",filt="all",cur=LS.cur||"₽",hid=LS.hid=="1",L=[],S={},G=[],AC=[],YR={},CM={},FQ=[];

function toast(m,a){$("#toast")?.remove();const t=document.createElement("div");t.id="toast";t.textContent=m;if(a){const b=document.createElement("button");b.textContent="Отменить";b.style.cssText="width:auto;margin:0 0 0 12px;padding:6px 12px;background:#ffffff33";b.onclick=()=>{a();t.remove()};t.appendChild(b)}document.body.appendChild(t);setTimeout(()=>t.remove(),a?6000:2600)}

function authView(){app.innerHTML=`<main style="padding-top:10vh"><div class="card hero" style="text-align:center"><div style=font-size:3.4rem>💰</div><h2 style=margin:4px>Финансы</h2><div class=m>Контролируйте деньги легко</div></div>
<div class=card><input id=e type=email placeholder=Email autocomplete=email><input id=p type=password placeholder="Пароль (от 8 символов)" autocomplete=current-password>
<p id=er class=neg style=margin:4px></p><button id=go>${reg?"Создать аккаунт":"Войти"}</button><button class=s style=text-align:center id=sw>${reg?"Уже есть аккаунт? Войти":"Нет аккаунта? Регистрация"}</button></div></main>`;

const row=t=>`<div class=op data-a=edit data-id=${t.id}><div class=ic style="background:${col(t.category)}22">${ico(t.category)}</div><div class=g><b>${esc(t.merchant||t.category)}</b><span class=m>${t.merchant?esc(t.category)+" · ":""}${esc(t.note)}${new Date(t.ts*1e3).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}</span></div><b class="${t.amount<0?"neg":"pos"}">${t.amount>0?"+":""}${$$(t.amount)}</b></div>`;
function donut(s){const tot=s.month_expense||1,C=251.33;let acc=0;
const seg=s.by_category.map((c,i)=>{const d=c.s/tot*C,o=`<circle r=40 cx=50 cy=50 fill=none stroke="${COL[i%8]}" stroke-width=13 stroke-linecap=butt stroke-dasharray="${Math.max(d-1,0)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"/>`;acc+=d;return o}).join("");
return`<div class=r><svg class=dn viewBox="0 0 100 100" style="max-width:150px"><circle r=40 cx=50 cy=50 fill=none stroke="#64748b22" stroke-width=13 />${seg}<text x=50 y=47 text-anchor=middle font-size=7 fill="#64748b">Расходы</text><text x=50 y=58 text-anchor=middle font-size=10 fill=currentColor font-weight=800>${hid?"••••":f0(s.month_expense)}</text></svg>
<div>${s.by_category.slice(0,6).map((c,i)=>`<div class=leg><i style=background:${COL[i%8]}></i><span>${esc(c.category)}</span><b>${Math.round(c.s/tot*100)}%</b></div>`).join("")||"<span class=m>Расходов нет</span>"}</div></div>`}
function spark(s){const d=Object.keys(s.daily);if(d.length<2)return"";const mx=Math.max(...Object.values(s.daily),1),n=31,pts=Array.from({length:n},(_,i)=>`${i/(n-1)*100},${50-(s.daily[i+1]||0)/mx*44}`).join(" ");return`<svg class=sp viewBox="0 0 100 50" preserveAspectRatio=none><polygon points="0,50 ${pts} 100,50" fill=#fff /></svg>`}
function greet(){const h=new Date().getHours();return h<6?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер"}
function vHome(s,l){const vs=s.prev_expense?`${s.month_expense>s.prev_expense?"▲":"▼"} ${Math.abs((s.month_expense/s.prev_expense-1)*100).toFixed(0)}% расходов к прошлому месяцу`:"Начните вести учёт — нажмите ＋";
return`<div class=hi>${greet()} 👋</div><div class="card hero"><button class=eye data-a=eye>${I("eye",20)}</button><div class=m>Общий баланс</div><div class=big data-cn=${s.balance}>${$$(s.balance)}</div>
<div class=r style=margin-top:8px><span>↑ ${$$(s.month_income)}</span><span>↓ ${$$(s.month_expense)}</span></div><div class=m style="margin-top:8px;position:relative">${vs}</div><div style=height:34px></div>${spark(s)}</div>
${(()=>{const fm={};L.filter(t=>t.amount<0).forEach(t=>{const k=[t.merchant,t.category,t.amount].join("|");(fm[k]=fm[k]||{n:0,t}).n++});FQ=Object.values(fm).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,5).map(x=>x.t);

${(()=>{const ins=[];s.by_category.forEach(c=>{const pv=(s.prev_by_category||{})[c.category];if(pv>0){const d=(c.s/pv-1)*100;if(Math.abs(d)>=20)ins.push(`${ico(c.category)} ${esc(c.category)}: ${d>0?"+":""}${d.toFixed(0)}% к прошлому месяцу`)}});
if(s.by_category[0])ins.unshift(`🏆 Больше всего: ${esc(s.by_category[0].category)} (${Math.round(s.by_category[0].s/s.month_expense*100)}%)`);
const nd=new Date(+mo.slice(0,4),+mo.slice(5),0).getDate(),dd=mo==lm(new Date())?new Date().getDate():nd;let z=0;for(let i=1;i<=dd;i++)if(!s.daily[i])z++;if(s.month_expense&&z)ins.push(`🧘 Дней без трат: ${z}`);

<div class=card><h3>Счета</h3><div class=gs>${AC.map(a=>`<div class=gc data-a=acc data-id=${a.id}><div class=ge>${esc(a.emoji)}</div><b>${esc(a.name||"Без счёта")}</b><span class=m>${$$(a.balance)}</span></div>`).join("")}<div class=gc data-a=accadd style="display:grid;place-items:center;color:var(--ac);font-weight:700;min-height:90px">${I("plus")}Счёт</div></div></div>
<div class=card><h3>Цели накоплений</h3><div class=gs>${G.map(g=>`<div class=gc data-a=goal data-id=${g.id}><div class=ge>${esc(g.emoji)}</div><b>${esc(g.name)}</b><div class=bar><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><span class=m>${f0(g.saved)} / ${f0(g.target)}</span></div>`).join("")}
<div class=gc data-a=goaladd style="display:grid;place-items:center;color:var(--ac);font-weight:700;min-height:110px">${I("plus")}Новая цель</div></div></div>
${(()=>{const now=new Date(),[yy,mm]=mo.split("-").map(Number),nd=new Date(yy,mm,0).getDate(),cm=mo==lm(now),dd=cm?now.getDate():nd,left=cm?nd-dd+1:0,fc=s.month_expense/dd*nd,lim=s.budgets.reduce((a,b)=>a+b.limit,0),rem=Math.max(0,lim-s.budgets.reduce((a,b)=>a+b.spent,0));

<div class=card><h3>Расходы по категориям</h3>${donut(s)}</div>
${s.budgets.length?`<div class=card><h3>Бюджеты</h3>${s.budgets.map(b=>{const p=b.spent/b.limit*100;return`<div class=r><span>${ico(b.category)} ${esc(b.category)}</span><span class="m rr">${f0(b.spent)} / ${f0(b.limit)}</span></div><div class=bar><i style="width:${Math.min(100,p)}%;background:${p>=100?"var(--rd)":p>=80?"var(--am)":""}"></i></div>`}).join("")}</div>`:""}
<div class=card><h3>Последние операции</h3>${l.slice(0,5).map(row).join("")||`<div class=emp><div>🧾</div>Пока пусто — нажмите ＋</div>`}</div>`}
function vOps(l){const fl=l.filter(t=>filt=="all"||(filt=="exp"?t.amount<0:t.amount>0));let d="",g=[];
const h=`<input id=q type=search placeholder="🔍  Магазин, категория, заметка" value="${esc(q)}"><div class=chips>${[["all","Все"],["exp","Расходы"],["inc","Доходы"]].map(([k,n])=>`<button data-a=filt data-k=${k} class="${filt==k?"on":""}">${n}</button>`).join("")}</div>`;

function vStats(s){const[y,m]=mo.split("-").map(Number),n=new Date(y,m,0).getDate(),dl=Array.from({length:n},(_,i)=>s.daily[i+1]||0),mx=Math.max(...dl,1),days=mo==lm(new Date())?new Date().getDate():n;
const mm={};L.filter(t=>t.amount<0&&t.merchant).forEach(t=>mm[t.merchant]=(mm[t.merchant]||0)-t.amount);const tm=Object.entries(mm).sort((a,b)=>b[1]-a[1]).slice(0,5);
